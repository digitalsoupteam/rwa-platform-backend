type WebhookEndpoint {
  id: ID!
  userId: String!
  url: String!
  events: [String!]!
  description: String
  active: Boolean!
  rateLimitPerMinute: Int!
  createdAt: String!
  updatedAt: String!
}

type CreateWebhookEndpointResult {
  id: ID!
  url: String!
  events: [String!]!
  description: String
  active: Boolean!
  rateLimitPerMinute: Int!
  secret: String!
  createdAt: String!
}

input CreateWebhookEndpointInput {
  url: String!
  events: [String!]!
  description: String
  rateLimitPerMinute: Int
}

input UpdateWebhookEndpointInput {
  id: ID!
  url: String
  events: [String!]
  description: String
  active: Boolean
  rateLimitPerMinute: Int
}

extend type Query {
  getWebhookEndpoints: [WebhookEndpoint!]!
  getWebhookEndpoint(id: ID!): WebhookEndpoint!
}

extend type Mutation {
  createWebhookEndpoint(input: CreateWebhookEndpointInput!): CreateWebhookEndpointResult!
  updateWebhookEndpoint(input: UpdateWebhookEndpointInput!): WebhookEndpoint!
  deleteWebhookEndpoint(id: ID!): ID!
}
